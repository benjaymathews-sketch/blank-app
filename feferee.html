<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Referee - TN Meet 2026</title><style>body{font-family:Arial;background:#fff7e6;padding:20px} .box{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:12px;border:1px solid #ddd} input,select{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:8px} button{width:100%;padding:12px;background:#ff8c00;color:#fff;border:0;border-radius:8px;font-weight:bold}</style></head><body><div class="box" id="login"><h2>🏁 Referee Login</h2><input id="pw" type="password" placeholder="Referee Password"><button onclick="login()">Login</button></div><div class="box" id="main" style="display:none"><h2>Referee - Results Entry</h2><input id="name" placeholder="Player Name"><select id="event"><option>100m</option><option>200m</option><option>400m</option><option>Long Jump</option><option>High Jump</option><option>Shot Put</option></select><input id="result" placeholder="Result / Timing - Ex: 11.24s"><select id="place"><option>1st Place</option><option>2nd Place</option><option>3rd Place</option><option>4th Place</option><option>Participation</option></select><button onclick="save()">Save Result ✅</button><p id="msg" style="color:green;text-align:center"></p><div id="list"></div></div><script>function login(){if(document.getElementById('pw').value==='referee2026'){document.getElementById('login').style.display='none';document.getElementById('main').style.display='block';show();}else alert('Wrong Password')}function save(){let arr=JSON.parse(localStorage.getItem('tn_results')||'[]');arr.push({name:document.getElementById('name').value,event:document.getElementById('event').value,result:document.getElementById('result').value,place:document.getElementById('place').value});localStorage.setItem('tn_results',JSON.stringify(arr));document.getElementById('msg').innerText='Result Saved ✅';show();}function show(){let arr=JSON.parse(localStorage.getItem('tn_results')||'[]');document.getElementById('list').innerHTML='<h3>Saved Results</h3>'+arr.map(r=>`<p>🏅 ${r.name} - ${r.event} - ${r.result} - ${r.place}</p>`).join('')}</script></body></html>
