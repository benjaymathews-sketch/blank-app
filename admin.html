<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - TN Meet 2026</title><style>body{font-family:Arial;background:#ffeef0;padding:20px} .box{max-width:700px;margin:auto;background:#fff;padding:20px;border-radius:12px} input{width:100%;padding:10px;margin:8px 0} button{width:100%;padding:12px;background:#dc2626;color:#fff;border:0;border-radius:8px;font-weight:bold;margin:5px 0}</style></head><body><div class="box" id="login"><h2>🔐 Admin Login</h2><input id="pw" type="password" placeholder="Admin Password"><button onclick="login()">Login</button></div><div class="box" id="main" style="display:none"><h2>Admin - Full Control</h2><h3>Entries</h3><div id="entries"></div><h3>Results</h3><div id="results"></div><button onclick="clearAll()" style="background:#111">🗑️ Clear All Data</button></div><script>function login(){if(document.getElementById('pw').value==='keyfive@123'){document.getElementById('login').style.display='none';document.getElementById('main').style.display='block';show();}else alert('Wrong Password')}function show(){let e=JSON.parse(localStorage.getItem('tn_entries')||'[]');document.getElementById('entries').innerHTML=e.length?e.map(x=>`<p>${x.name} - ${x.district} - ${x.event}</p>`).join(''):'No Entries';let r=JSON.parse(localStorage.getItem('tn_results')||'[]');document.getElementById('results').innerHTML=r.length?r.map(x=>`<p>${x.name} - ${x.event} - ${x.result} - ${x.place}</p>`).join(''):'No Results'}function clearAll(){if(confirm('All Data Delete Pannava?')){localStorage.removeItem('tn_entries');localStorage.removeItem('tn_results');show();}}</script></body></html>
