<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><style>body{font-family:Arial;background:#f1f5f9;padding:20px}.box{max-width:700px;margin:auto;background:#fff;padding:20px;border-radius:12px}input{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}button{padding:10px 14px;border:0;border-radius:8px;font-weight:bold;cursor:pointer;color:#fff}.card{border:1px solid #e2e8f0;padding:12px;border-radius:10px;margin:10px 0;background:#f8fafc}.small{font-size:13px;color:#475569}.edit{background:#0b5cff}.del{background:#dc2626}.save{background:#16a34a}</style></head><body><div class="box" id="loginBox"><h2>🔐 Admin Login</h2><input id="pass" type="password" placeholder="Password"><button style="background:#0b5cff;width:100%" onclick="login()">Login</button><p id="err" style="color:red"></p></div><div class="box" id="mainBox" style="display:none"><h2>🏆 Admin Dashboard</h2><p>Total Entries: <b id="total">0</b></p><button style="background:#0b5cff" onclick="load()">🔄 Refresh</button> <button style="background:#dc2626" onclick="clearAll()">🗑️ Clear All Data</button> <button style="background:#16a34a" onclick="location.href='index.html'">← Back to Entry Form</button><hr><h3>All Entries</h3><div id="list"></div><hr><h3>All Results</h3><div id="res"></div></div><script>function login(){if(document.getElementById('pass').value=='admin123'){document.getElementById('loginBox').style.display='none';document.getElementById('mainBox').style.display='block';load();}else{document.getElementById('err').innerText='Wrong Password';}}function load(){let arr=JSON.parse(localStorage.getItem('tn_entries')||'[]');document.getElementById('total').innerText=arr.length;let h='';if(arr.length==0)h='<p>No Data</p>';arr.forEach((e,i)=>{h+=`<div class="card"><b>${i+1}. ${e.name}</b> <span class="small">- ${e.district||''} | ${e.age||''} | ${e.gender||''}</span><br><span class="small">📞 ${e.phone||''} | 📅 DOB: ${e.dob||'Not Given'} | 🕒 ${e.time||''}</span><br><span class="small">🏃 Events: ${e.event||''}</span><br><br><button class="edit" onclick="editEntry(${i})">✏️ Edit</button> <button class="del" onclick="delEntry(${i})">🗑️ Delete</button><div id="editBox${i}" style="display:none;margin-top:10px"><input id="eName${i}" value="${e.name||''}" placeholder="Name"><input id="ePhone${i}" value="${e.phone||''}" placeholder="Phone"><input id="eDistrict${i}" value="${e.district||''}" placeholder="District"><input id="eDob${i}" type="date" value="${e.dob||''}"><input id="eEvent${i}" value="${e.event||''}" placeholder="Events"><button class="save" onclick="saveEdit(${i})">✅ Save Changes</button> <button onclick="document.getElementById('editBox${i}').style.display='none'">Cancel</button></div></div>`});document.getElementById('list').innerHTML=h;let r=JSON.parse(localStorage.getItem('tn_results')||'[]');let rh='';if(r.length==0)rh='<p>No Data</p>';r.forEach((x,i)=>{rh+=`<div class="card">${i+1}. ${x.name||''} - ${x.event||''} - ${x.result||''} <button class="del" onclick="delResult(${i})">🗑️ Delete</button></div>`});document.getElementById('res').innerHTML=rh;}function editEntry(i){let b=document.getElementById('editBox'+i);b.style.display=b.style.display=='none'?'block':'none';}function saveEdit(i){let arr=JSON.parse(localStorage.getItem('tn_entries')||'[]');arr[i].name=document.getElementById('eName'+i).value;arr[i].phone=document.getElementById('ePhone'+i).value;arr[i].district=document.getElementById('eDistrict'+i).value;arr[i].dob=document.getElementById('eDob'+i).value;arr[i].event=document.getElementById('eEvent'+i).value;localStorage.setItem('tn_entries',JSON.stringify(arr));alert('Updated ✅');load();}function delEntry(i){if(confirm('Delete Pannava? '+ (JSON.parse(localStorage.getItem('tn_entries')||'[]')[i].name||''))){let arr=JSON.parse(localStorage.getItem('tn_entries')||'[]');arr.splice(i,1);localStorage.setItem('tn_entries',JSON.stringify(arr));load();}}function delResult(i){if(confirm('Result Delete Pannava?')){let r=JSON.parse(localStorage.getItem('tn_results')||'[]');r.splice(i,1);localStorage.setItem('tn_results',JSON.stringify(r));load();}}function clearAll(){if(confirm('Ella Data-vum Delete Pannava?')){localStorage.removeItem('tn_entries');localStorage.removeItem('tn_results');load();}}</script></body></html>
