<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Tamil Nadu Meet</title><style>body{font-family:Arial;background:#fef2f2;padding:20px}.box{max-width:700px;margin:auto;background:#fff;padding:20px;border-radius:12px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:8px;font-size:14px}th{background:#dc2626;color:#fff}button{padding:10px 15px;background:#dc2626;color:#fff;border:0;border-radius:8px;margin:5px}input{padding:10px;width:100%;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}</style></head><body><div class="box"><h2 style="text-align:center">🔐 Admin Dashboard</h2><div id="login"><p style="text-align:center">Password Podunga</p><input type="password" id="pass" placeholder="Password"><button onclick="login()">Login</button><p style="font-size:12px;text-align:center;color:#888">Demo Password: admin123</p></div><div id="panel" style="display:none"><div style="text-align:center"><button onclick="load()">Refresh 🔄</button><button onclick="clearAll()" style="background:#333">Clear All Data</button></div><h3>All Entries</h3><div id="entries"></div><h3>All Results</h3><div id="results"></div></div></div><script>function login(){if(document.getElementById('pass').value==='admin123'){document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';load();}else{alert('Wrong Password');}}function load(){let e=JSON.parse(localStorage.getItem('tn_entries')||'[]');let r=JSON.parse(localStorage.getItem('tn_results')||'[]');let eh='<table><tr><th>Name</th><th>District</th><th>Event</th><th>Phone</th></tr>';e.forEach(x=>{eh+='<tr><td>'+x.name+'</td><td>'+x.district+'</td><td>'+x.event+'</td><td>'+x.phone+'</td></tr>'});eh+='</table>';document.getElementById('entries').innerHTML=e.length?eh:'No Data';let rh='<table><tr><th>Bib</th><th>Name</th><th>Event</th><th>Result</th></tr>';r.forEach(x=>{rh+='<tr><td>'+x.bib+'</td><td>'+x.name+'</td><td>'+x.event+'</td><td><b>'+x.result+'</b></td></tr>'});rh+='</table>';document.getElementById('results').innerHTML=r.length?rh:'No Data';}function clearAll(){if(confirm('Full Data Clear Pannava?')){localStorage.removeItem('tn_entries');localStorage.removeItem('tn_results');load();}}</script></body></html>
