<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>body{font-family:Arial;background:#f1f5f9;padding:15px}.box{max-width:750px;margin:auto;background:#fff;padding:20px;border-radius:12px}input,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}button{padding:10px 14px;border:0;border-radius:8px;font-weight:bold;cursor:pointer;color:#fff;margin:2px}.card{border:1px solid #e2e8f0;padding:14px;border-radius:10px;margin:12px 0;background:#f8fafc}.small{font-size:13px;color:#475569;line-height:1.6}.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:bold;color:#fff}</style></head><body><div class="box" id="loginBox"><h2>🔐 Admin Login</h2><input id="pass" type="password" placeholder="Password - admin123"><button style="background:#0b5cff;width:100%" onclick="login()">Login</button><p id="err" style="color:red"></p></div><div class="box" id="mainBox" style="display:none"><h2>🏆 Admin Dashboard</h2><p>Total: <b id="total">0</b></p><button style="background:#0b5cff" onclick="load()">🔄 Refresh</button><button style="background:#dc2626" onclick="clearAll()">🗑️ Clear All</button><button style="background:#16a34a" onclick="location.href='index.html'">← Entry Form</button><hr><h3>All Entries - Full Details</h3><div id="list"></div><hr><h3>All Results</h3><div id="res"></div></div><script>function login(){if(document.getElementById('pass').value=='admin123'){document.getElementById('loginBox').style.display='none';document.getElementById('mainBox').style.display='block';load();}else{document.getElementById('err').innerText='Wrong Password';}}function load(){let arr=JSON.parse(localStorage.getItem('tn_entries')||'[]');document.getElementById('total').innerText=arr.length;let h='';if(arr.length==0)h='<p>No Entries Yet</p>';arr.forEach((e,i)=>{let c=e.meet=='Swimming'?'#0284c7':'#0b5cff';h+=`<div class="card"><span class="badge" style="background:${c}">${e.meet||'-'}</span> <b>${i+1}. ${e.name||''}</b><br><div class="small">📞 Phone: ${e.phone||'-'}<br>📍 District: ${e.district||'-'}<br>📅 DOB: ${e.dob||'-'}<br>🎂 Age: ${e.age||'-'}<br>👤 Gender: ${e.gender||'-'}<br>🏃 Events: ${e.event||'-'}<br>🕒 Submitted: ${e.time||'-'}</div><br><button style="background:#0b5cff" onclick="editEntry(${i})">✏️ Edit Full Details</button> <button style="background:#dc2626" onclick="delEntry(${i})">🗑️ Delete</button><div id="editBox${i}" style="display:none;margin-top:12px;background:#fff;padding:12px;border-radius:8px;border:1px solid #cbd5e1"><b>Edit - ${e.name||''}</b><label>Meet</label><select id="eMeet${i}"><option ${e.meet=='Athletics'?'selected':''}>Athletics</option><option ${e.meet=='Swimming'?'selected':''}>Swimming</option></select><label>Name</label><input id="eName${i}" value="${e.name||''}"><label>Phone</label><input id="ePhone${i}" value="${e.phone||''}"><label>District</label><input id="eDistrict${i}" value="${e.district||''}"><label>DOB</label><input id="eDob${i}" type="date" value="${e.dob||''}"><label>Age</label><select id="eAge${i}"><option ${e.age=='Under 14'?'selected':''}>Under 14</option><option ${e.age=='Under 16'?'selected':''}>Under 16</option><option ${e.age=='Under 18'?'selected':''}>Under 18</option><option ${e.age=='Under 20'?'selected':''}>Under 20</option><option ${e.age=='Open'?'selected':''}>Open</option></select><label>Gender</label><select id="eGender${i}"><option ${e.gender=='Male'?'selected':''}>Male</option><option ${e.gender=='Female'?'selected':''}>Female</option></select><label>Events</label><input id="eEvent${i}" value="${e.event||''}"><button style="background:#16a34a;width:100%" onclick="saveEdit(${i})">✅ Save Changes</button></div></div>`;});document.getElementById('list').innerHTML=h;let r=JSON.parse(localStorage.getItem('tn_results')||'[]');let rh='';if(r.length==0)rh='<p>No Results Yet</p>';r.forEach((x,i)=>{rh+=`<div class="card">${i+1}. ${x.name||''} - ${x.event||''} - ${x.result||''} <button style="background:#dc2626" onclick="delResult(${i})">🗑️ Delete</button></div>`;});document.getElementById('res').innerHTML=rh;}function editEntry(i){let b=document.getElementById('editBox'+i);b.style.display=b.style.display=='none'?'block':'none';}function saveEdit(i){let arr=JSON.parse(localStorage.getItem('tn_entries')||'[]');arr[i].meet=document.getElementById('eMeet'+i).value;arr[i].name=document.getElementById('eName'+i).value;arr[i].phone=document.getElementById('ePhone'+i).value;arr[i].district=document.getElementById('eDistrict'+i).value;arr[i].dob=document.getElementById('eDob'+i).value;arr[i].age=document.getElementById('eAge'+i).value;arr[i].gender=document.getElementById('eGender'+i).value;arr[i].event=document.getElementById('eEvent'+i).value;localStorage.setItem('tn_entries',JSON.stringify(arr));alert('Updated ✅ - '+arr[i].name);load();}function delEntry(i){let arr=JSON.parse(localStorage.getItem('tn_entries')||'[]');if(confirm('Delete Pannava? '+arr[i].name)){arr.splice(i,1);localStorage.setItem('tn_entries',JSON.stringify(arr));load();}}function delResult(i){if(confirm('Result Delete Pannava?')){let r=JSON.parse(localStorage.getItem('tn_results')||'[]');r.splice(i,1);localStorage.setItem('tn_results',JSON.stringify(r));load();}}function clearAll(){if(confirm('Ella Data-vum Delete Pannava?')){localStorage.removeItem('tn_entries');localStorage.removeItem('tn_results');load();}}</script></body></html>
