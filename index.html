<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tamil Nadu Meet 2026 - Entry</title><style>body{font-family:Arial;background:#f4f6f8;padding:20px} .box{max-width:500px;margin:auto;background:#fff;padding:20px;border-radius:12px} input,select{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:8px} button{width:100%;padding:12px;background:#0b5cff;color:#fff;border:0;border-radius:8px;font-weight:bold} h2{text-align:center}</style></head><body><div class="box"><h2>🏆 Tamil Nadu State Meet 2026</h2><p style="text-align:center">📅 17 to 19 Dec 2026 - Chennai<br>ENTRY FORM</p><input id="name" placeholder="Player Name *"><input id="district" placeholder="District *"><input id="age" placeholder="Age *"><select id="event"><option>100m</option><option>200m</option><option>400m</option><option>Long Jump</option><option>High Jump</option><option>Shot Put</option></select><input id="phone" placeholder="Phone Number"><button onclick="save()">Submit Entry ✅</button><p id="msg" style="text-align:center;color:green"></p><p style="text-align:center;font-size:13px;color:#888">For Officials / Referee - Contact Admin</p></div><script>function save(){let n=document.getElementById('name').value;let d=document.getElementById('district').value;if(!n||!d){alert('Name & District Podunga');return}let arr=JSON.parse(localStorage.getItem('tn_entries')||'[]');arr.push({name:n,district:d,age:document.getElementById('age').value,event:document.getElementById('event').value,phone:document.getElementById('phone').value,time:new Date().toLocaleString()});localStorage.setItem('tn_entries',JSON.stringify(arr));document.getElementById('msg').innerText='Entry Saved Successfully ✅';document.getElementById('name').value='';}</script></body></html>
