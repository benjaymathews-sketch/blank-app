<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tamil Nadu Meet - Entry</title><style>body{font-family:Arial;background:#eef2ff;padding:20px}.box{max-width:520px;margin:auto;background:#fff;padding:20px;border-radius:12px;border:1px solid #c7d2fe}input,select{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}button{width:100%;padding:12px;background:#0b5cff;color:#fff;border:0;border-radius:8px;font-weight:bold}.ev{background:#f8fafc;padding:10px;border-radius:8px;margin:8px 0}.ev label{display:block;padding:6px;font-size:14px}.ev input{width:auto;margin-right:8px}h3{margin:10px 0 5px}label{font-size:13px;font-weight:bold;color:#333}</style></head><body><div class="box"><h2 style="text-align:center">🏃 Tamil Nadu State Meet 2026</h2><p style="text-align:center">17 to 19 Dec 2026 - Chennai | Entry Form</p><input id="name" placeholder="Player Name *"><input id="phone" placeholder="Phone Number *"><input id="district" placeholder="District *"><label>Date of Birth *</label><input id="dob" type="date"><select id="age"><option>Under 14</option><option>Under 16</option><option>Under 18</option><option>Under 20</option><option>Open</option></select><select id="gender"><option>Male</option><option>Female</option></select><h3>🏃 Athletics - Max 5 Events</h3><div class="ev"><label><input type="checkbox" value="100m" onchange="checkMax(this)"> 100m</label><label><input type="checkbox" value="200m" onchange="checkMax(this)"> 200m</label><label><input type="checkbox" value="400m" onchange="checkMax(this)"> 400m</label><label><input type="checkbox" value="800m" onchange="checkMax(this)"> 800m</label><label><input type="checkbox" value="1500m" onchange="checkMax(this)"> 1500m</label><label><input type="checkbox" value="Long Jump" onchange="checkMax(this)"> Long Jump</label><label><input type="checkbox" value="High Jump" onchange="checkMax(this)"> High Jump</label><label><input type="checkbox" value="Shot Put" onchange="checkMax(this)"> Shot Put</label><label><input type="checkbox" value="Discus Throw" onchange="checkMax(this)"> Discus Throw</label><label><input type="checkbox" value="Javelin Throw" onchange="checkMax(this)"> Javelin Throw</label></div><h3>🏊 Swimming - Max 5 Events</h3><div class="ev"><label><input type="checkbox" value="50m Freestyle" onchange="checkMax(this)"> 50m Freestyle</label><label><input type="checkbox" value="100m Freestyle" onchange="checkMax(this)"> 100m Freestyle</label><label><input type="checkbox" value="200m Freestyle" onchange="checkMax(this)"> 200m Freestyle</label><label><input type="checkbox" value="50m Backstroke" onchange="checkMax(this)"> 50m Backstroke</label><label><input type="checkbox" value="100m Backstroke" onchange="checkMax(this)"> 100m Backstroke</label><label><input type="checkbox" value="50m Breaststroke" onchange="checkMax(this)"> 50m Breaststroke</label><label><input type="checkbox" value="100m Breaststroke" onchange="checkMax(this)"> 100m Breaststroke</label><label><input type="checkbox" value="50m Butterfly" onchange="checkMax(this)"> 50m Butterfly</label><label><input type="checkbox" value="100m Butterfly" onchange="checkMax(this)"> 100m Butterfly</label><label><input type="checkbox" value="200m Individual Medley" onchange="checkMax(this)"> 200m Individual Medley</label></div><p id="count" style="text-align:center;color:#0b5cff;font-weight:bold">Selected: 0 / 5</p><button onclick="save()">Submit Entry ✅</button><p id="msg" style="text-align:center;color:green"></p><div style="text-align:center;margin-top:15px"><button onclick="location.href='official.html'" style="width:auto;background:#16a34a">Official Board →</button> <button onclick="location.href='referee.html'" style="width:auto;background:#ea580c">Referee Panel →</button></div></div><script>function checkMax(el){let all=document.querySelectorAll('input[type=checkbox]:checked');if(all.length>5){el.checked=false;alert('Max 5 Events Dhan!');return}document.getElementById('count').innerText='Selected: '+all.length+' / 5';}function save(){let name=document.getElementById('name').value;let dob=document.getElementById('dob').value;if(!name){alert('Name Podunga');return}if(!dob){alert('Date of Birth Select Pannunga');return}let sel=[...document.querySelectorAll('input[type=checkbox]:checked')].map(c=>c.value);if(sel.length==0){alert('Oru Event Select Pannunga');return}let arr=JSON.parse(localStorage.getItem('tn_entries')||'[]');arr.push({name:name,phone:document.getElementById('phone').value,district:document.getElementById('district').value,dob:dob,age:document.getElementById('age').value,gender:document.getElementById('gender').value,event:sel.join(', '),time:new Date().toLocaleString()});localStorage.setItem('tn_entries',JSON.stringify(arr));document.getElementById('msg').innerText='Entry Saved ✅ - DOB: '+dob;}</script></body></html>
