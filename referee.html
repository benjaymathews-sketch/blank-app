<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Referee - Tamil Nadu Meet</title><style>body{font-family:Arial;background:#fff7ed;padding:20px}.box{max-width:500px;margin:auto;background:#fff;padding:20px;border-radius:12px;border:1px solid #fed7aa}input,select{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:8px}button{width:100%;padding:12px;background:#ea580c;color:#fff;border:0;border-radius:8px;font-weight:bold}</style></head><body><div class="box"><h2 style="text-align:center">🏁 Referee Panel</h2><p style="text-align:center">Tamil Nadu State Meet 2026</p><input id="bib" placeholder="Bib Number *"><input id="name" placeholder="Player Name"><select id="event"><option>100m</option><option>200m</option><option>400m</option><option>Long Jump</option><option>High Jump</option><option>Shot Put</option></select><input id="result" placeholder="Result / Time - Ex: 11.24 / 6.45m"><button onclick="save()">Save Result ✅</button><p id="msg" style="text-align:center;color:green"></p><button onclick="location.href='official.html'" style="background:#333;margin-top:10px">View Official Board →</button></div><script>function save(){let b=document.getElementById('bib').value;if(!b){alert('Bib Podunga');return}let arr=JSON.parse(localStorage.getItem('tn_results')||'[]');arr.push({bib:b,name:document.getElementById('name').value,event:document.getElementById('event').value,result:document.getElementById('result').value,time:new Date().toLocaleString()});localStorage.setItem('tn_results',JSON.stringify(arr));document.getElementById('msg').innerText='Result Saved ✅';}</script></body></html>
