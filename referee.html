<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Referee Panel</title><style>body{font-family:Arial;background:#fff7ed;padding:15px}.box{max-width:700px;margin:auto;background:#fff;padding:20px;border-radius:12px}input,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}button{padding:10px 14px;border:0;border-radius:8px;font-weight:bold;cursor:pointer;color:#fff;margin:2px}.card{border:1px solid #e2e8f0;padding:14px;border-radius:10px;margin:12px 0;background:#f8fafc}</style></head><body><div class="box"><h2 style="text-align:center">🏅 Referee Panel</h2><h3>Enter Result</h3><input id="rName" placeholder="Player Name"><input id="rEvent" placeholder="Event - Ex: 100m"><input id="rResult" placeholder="Result - Ex: 11.2 sec / 1st Place"><select id="rPlace"><option>1st Place 🥇</option><option>2nd Place 🥈</option><option>3rd Place 🥉</option><option>4th Place</option><option>Finished</option><option>Disqualified</option></select><button style="background:#ea580c;width:100%" onclick="saveResult()">✅ Save Result</button><p id="rMsg" style="color:green;text-align:center"></p><hr><h3>All Results</h3><button style="background:#0b5cff" onclick="load()">🔄 Refresh</button> <button style="background:#16a34a" onclick="location.href='index.html'">← Entry Form</button> <button style="background:#0b5cff" onclick="location.href='official.html'">Official Board →</button><div id="list"></div><hr><h3>All Players</h3><div id="players"></div></div><script>function saveResult(){let n=document.getElementById('rName').value;let e=document.getElementById('rEvent').value;let r=document.getElementById('rResult').value;let p=document.getElementById('rPlace').value;if(!n||!e||!r){alert('Name, Event, Result Podunga');return}let arr=JSON.parse(localStorage.getItem('tn_results')||'[]');arr.push({name:n,event:e,result:r,place:p,time:new Date().toLocaleString()});localStorage.setItem('tn_results',JSON.stringify(arr));document.getElementById('rMsg').innerText='Result Saved ✅ - '+n+' - '+p;load();}function load(){let arr=JSON.parse(localStorage.getItem('tn_results')||'[]');let h='';if(arr.length==0)h='<p>No Results Yet</p>';arr.forEach((x,i)=>{h+=`<div class="card"><b>${i+1}. ${x.name}</b> - ${x.event} - ${x.result} - ${x.place} <button style="background:#dc2626" onclick="delR(${i})">🗑️ Delete</button></div>`;});document.getElementById('list').innerHTML=h;let pArr=JSON.parse(localStorage.getItem('tn_entries')||'[]');let ph='';if(pArr.length==0)ph='<p>No Players Yet</p>';pArr.forEach((e,i)=>{ph+=`<div class="card">${i+1}. <b>${e.name||''}</b> (${e.meet||''}) - ${e.event||''} <button style="background:#16a34a" onclick="fillPlayer('${e.name||''}','${e.event||''}')">Use This Player</button></div>`;});document.getElementById('players').innerHTML=ph;}function fillPlayer(n,e){document.getElementById('rName').value=n;document.getElementById('rEvent').value=e.split(',')[0];}function delR(i){if(confirm('Result Delete Pannava?')){let arr=JSON.parse(localStorage.getItem('tn_results')||'[]');arr.splice(i,1);localStorage.setItem('tn_results',JSON.stringify(arr));load();}}load();</script></body></html>
