<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Official Board - Tamil Nadu Meet</title><style>body{font-family:Arial;background:#f0fdf4;padding:20px}.box{max-width:700px;margin:auto;background:#fff;padding:20px;border-radius:12px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:8px;text-align:left;font-size:14px}th{background:#16a34a;color:#fff}button{padding:10px 15px;background:#0b5cff;color:#fff;border:0;border-radius:8px;margin:5px}</style></head><body><div class="box"><h2 style="text-align:center">📋 Official Results Board</h2><p style="text-align:center">Tamil Nadu State Meet 2026 - LIVE</p><div style="text-align:center"><button onclick="load()">Refresh 🔄</button><button onclick="location.href='referee.html'" style="background:#ea580c">Referee Panel →</button></div><h3>Entries</h3><div id="entries">No Entries Yet</div><h3>Results</h3><div id="results">No Results Yet</div></div><script>function load(){let e=JSON.parse(localStorage.getItem('tn_entries')||'[]');let r=JSON.parse(localStorage.getItem('tn_results')||'[]');let eh='<table><tr><th>Name</th><th>District</th><th>Event</th></tr>';e.forEach(x=>{eh+='<tr><td>'+x.name+'</td><td>'+x.district+'</td><td>'+x.event+'</td></tr>'});eh+='</table>';document.getElementById('entries').innerHTML=e.length?eh:'No Entries Yet';let rh='<table><tr><th>Bib</th><th>Name</th><th>Event</th><th>Result</th></tr>';r.forEach(x=>{rh+='<tr><td>'+x.bib+'</td><td>'+x.name+'</td><td>'+x.event+'</td><td><b>'+x.result+'</b></td></tr>'});rh+='</table>';document.getElementById('results').innerHTML=r.length?rh:'No Results Yet';}load();</script></body></html>
