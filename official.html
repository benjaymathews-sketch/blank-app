<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Official - TN Meet 2026</title><style>body{font-family:Arial;background:#eef2ff;padding:20px} .box{max-width:700px;margin:auto;background:#fff;padding:20px;border-radius:12px} input{width:100%;padding:10px;margin:8px 0} button{width:100%;padding:12px;background:#4f46e5;color:#fff;border:0;border-radius:8px;font-weight:bold} table{width:100%;border-collapse:collapse} td,th{border:1px solid #ddd;padding:8px;font-size:13px}</style></head><body><div class="box" id="login"><h2>👔 Official Login</h2><input id="pw" type="password" placeholder="Official Password"><button onclick="login()">Login</button></div><div class="box" id="main" style="display:none"><h2>Official View - Paakka Mattum</h2><h3>📝 Entries</h3><div id="entries"></div><h3>🏆 Results</h3><div id="results"></div></div><script>function login(){if(document.getElementById('pw').value==='official2026'){document.getElementById('login').style.display='none';document.getElementById('main').style.display='block';let e=JSON.parse(localStorage.getItem('tn_entries')||'[]');document.getElementById('entries').innerHTML=e.length?e.map(x=>`<p>${x.name} - ${x.district} - ${x.event} - Age ${x.age}</p>`).join(''):'No Entries Yet';let r=JSON.parse(localStorage.getItem('tn_results')||'[]');document.getElementById('results').innerHTML=r.length?r.map(x=>`<p>${x.name} - ${x.event} - ${x.result} - ${x.place}</p>`).join(''):'No Results Yet';}else alert('Wrong Password')}</script></body></html>
